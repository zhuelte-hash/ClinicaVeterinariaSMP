<admin-page-header title="Usuarios" description="Accesos y roles del equipo de la clinica." action="Nuevo usuario" (actionClick)="open.set(true)"/><div class="admin-card mb-4 p-4"><input class="admin-input max-w-sm" placeholder="Buscar nombre, correo o rol" [ngModel]="query()" (ngModelChange)="query.set($event)"></div><div class="admin-card overflow-x-auto"><table class="admin-table"><thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>@for (user of users(); track user.id) {<tr><td><div class="flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-xl bg-teal-50 font-bold text-teal-700">{{ user.name.charAt(0) }}</span><b class="text-slate-800">{{ user.name }}</b></div></td><td>{{ user.email }}</td><td>{{ user.role }}</td><td><admin-status-badge [status]="user.active ? 'Activo' : 'Inactivo'"/></td><td><button class="font-semibold" [class.text-rose-600]="user.active" [class.text-teal-600]="!user.active" (click)="data.toggleUser(user.id)">{{ user.active ? 'Desactivar' : 'Activar' }}</button></td></tr>}</tbody></table></div>
@if (open()) {<div class="admin-modal" (click)="open.set(false)"><form class="admin-modal-panel" (ngSubmit)="save()" (click)="$event.stopPropagation()"><h2 class="text-xl font-bold">Nuevo usuario</h2><label class="mt-5 block"><span class="admin-label">Nombre completo</span><input required class="admin-input" name="name" [(ngModel)]="form.name"></label><label class="mt-4 block"><span class="admin-label">Correo</span><input required type="email" class="admin-input" name="email" [(ngModel)]="form.email"></label><label class="mt-4 block"><span class="admin-label">Rol</span><select class="admin-input" name="role" [(ngModel)]="form.role"><option>Administrador</option><option>Veterinario</option><option>Recepcionista</option></select></label><div class="mt-5 flex justify-end gap-2"><button type="button" class="admin-secondary" (click)="open.set(false)">Cancelar</button><button class="admin-primary">Crear usuario</button></div></form></div>}
