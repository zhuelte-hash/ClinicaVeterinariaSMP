<admin-page-header title="Notificaciones" description="Alertas operativas y novedades de la clinica."/><div class="mb-4 flex flex-wrap gap-2"><button class="admin-secondary" [class.!bg-teal-50]="showUnread()" (click)="showUnread.update(v => !v)">Solo no leidas</button><button class="admin-primary" (click)="data.markAllNotifications()">Marcar todas como leidas</button></div><div class="admin-card divide-y divide-slate-100">@for (item of items(); track item.id) {<button class="flex w-full gap-4 p-5 text-left hover:bg-slate-50" [class.bg-teal-50]="!item.read" (click)="data.markNotification(item.id)"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl" [class.bg-rose-100]="item.kind === 'stock'" [class.text-rose-700]="item.kind === 'stock'" [class.bg-sky-100]="item.kind === 'cita'" [class.text-sky-700]="item.kind === 'cita'" [class.bg-slate-100]="item.kind === 'sistema'">@switch (item.kind) {@case ('stock') {!} @case ('cita') {+} @default {i}}</span><span class="flex-1"><b class="text-sm text-slate-900">{{ item.title }}</b><span class="mt-1 block text-sm text-slate-500">{{ item.message }}</span></span><time class="text-xs text-slate-400">{{ item.time }}</time></button>} @empty {<p class="p-10 text-center text-slate-500">No hay notificaciones pendientes.</p>}</div>
