<admin-page-header title="Categorias" description="Organiza los productos del catalogo." action="Nueva categoria" (actionClick)="open.set(true)"/><div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">@for (category of data.categories(); track category.id) {<article class="admin-card p-5"><div class="flex items-start justify-between"><span class="grid h-11 w-11 place-items-center rounded-xl bg-teal-50 font-bold text-teal-700">{{ category.name.charAt(0) }}</span><span class="rounded-full bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-700">Activa</span></div><h2 class="mt-4 font-bold text-slate-900">{{ category.name }}</h2><p class="mt-1 min-h-10 text-sm text-slate-500">{{ category.description }}</p><p class="mt-4 border-t border-slate-100 pt-3 text-xs font-semibold text-slate-400">{{ category.products }} productos</p></article>}</div>
@if (open()) {<div class="admin-modal" (click)="open.set(false)"><form class="admin-modal-panel" (ngSubmit)="save()" (click)="$event.stopPropagation()"><h2 class="text-xl font-bold">Nueva categoria</h2><label class="mt-5 block"><span class="admin-label">Nombre</span><input required class="admin-input" name="name" [(ngModel)]="form.name"></label><label class="mt-4 block"><span class="admin-label">Descripcion</span><textarea required rows="3" class="admin-input" name="description" [(ngModel)]="form.description"></textarea></label><div class="mt-5 flex justify-end gap-2"><button type="button" class="admin-secondary" (click)="open.set(false)">Cancelar</button><button class="admin-primary">Crear categoria</button></div></form></div>}
