<admin-page-header title="Historial clinico" description="Expedientes y seguimiento de pacientes." action="Nueva consulta" (actionClick)="open.set(true)"/><div class="admin-card mb-4 p-4"><input class="admin-input max-w-sm" placeholder="Buscar paciente o propietario" [ngModel]="query()" (ngModelChange)="query.set($event)"></div><div class="space-y-3">@for (record of records(); track record.id) {<article class="admin-card overflow-hidden"><button class="flex w-full items-center gap-4 p-4 text-left" (click)="expanded.set(expanded() === record.id ? null : record.id)"><span class="grid h-11 w-11 place-items-center rounded-xl bg-teal-50 font-bold text-teal-700">{{ record.patient.charAt(0) }}</span><span class="flex-1"><b class="block text-slate-900">{{ record.patient }} · {{ record.species }}</b><small class="text-slate-500">{{ record.owner }} · {{ record.date }}</small></span><span class="text-sm font-semibold text-teal-600">{{ expanded() === record.id ? 'Ocultar' : 'Ver detalle' }}</span></button>@if (expanded() === record.id) {<div class="grid gap-4 border-t border-slate-100 bg-slate-50 p-5 md:grid-cols-3"><div><span class="admin-label">DIAGNOSTICO</span><p class="text-sm">{{ record.diagnosis }}</p></div><div><span class="admin-label">TRATAMIENTO</span><p class="text-sm">{{ record.treatment }}</p></div><div><span class="admin-label">VETERINARIO</span><p class="text-sm">{{ record.veterinarian }}</p></div></div>}</article>}</div>
@if (open()) {<div class="admin-modal" (click)="open.set(false)"><form class="admin-modal-panel grid gap-4 sm:grid-cols-2" (ngSubmit)="save()" (click)="$event.stopPropagation()"><h2 class="text-xl font-bold sm:col-span-2">Registrar consulta</h2><label><span class="admin-label">Paciente</span><input required class="admin-input" name="patient" [(ngModel)]="form.patient"></label><label><span class="admin-label">Especie</span><select class="admin-input" name="species" [(ngModel)]="form.species"><option>Canino</option><option>Felino</option><option>Ave</option><option>Otro</option></select></label><label><span class="admin-label">Propietario</span><input required class="admin-input" name="owner" [(ngModel)]="form.owner"></label><label><span class="admin-label">Veterinario</span><select class="admin-input" name="vet" [(ngModel)]="form.veterinarian"><option>Dra. Rojas</option><option>Dr. Salazar</option></select></label><label class="sm:col-span-2"><span class="admin-label">Diagnostico</span><textarea required rows="2" class="admin-input" name="diagnosis" [(ngModel)]="form.diagnosis"></textarea></label><label class="sm:col-span-2"><span class="admin-label">Tratamiento</span><textarea required rows="2" class="admin-input" name="treatment" [(ngModel)]="form.treatment"></textarea></label><div class="flex justify-end gap-2 sm:col-span-2"><button type="button" class="admin-secondary" (click)="open.set(false)">Cancelar</button><button class="admin-primary">Guardar consulta</button></div></form></div>}
