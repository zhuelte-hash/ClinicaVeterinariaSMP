services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Neon ya tiene una revision posterior a las migraciones de este repositorio.
    # No ejecutar Alembic automaticamente hasta recuperar esa migracion.
    command: >-
      sh -c "(python -m app.tasks.appointment_worker &) &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    command: npm start -- --host 0.0.0.0 --poll 2000
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
